        <h1>The Artisan Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="enquiry.html">Enquiry</a></li>

        </nav>
    </header>

    <main>
        <h2>Custom Order Enquiry</h2>
        <p>Fill in the form below for personalised cakes, event catering, or bulk orders.</p>

        <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <label for="order-type">Order Type:</label>
            <select id="order-type" name="order-type">
                <option value="cake">Celebration Cake</option>
                <option value="pastries">Pastry Platter</option>
                <option value="bread">Bread Basket</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Message / Details:</label>
            <textarea id="message" name="message" rows="5" placeholder="Describe your requirements..."></textarea>

            <button type="submit">Send Enquiry</button>
        </form>
    </main>

    <footer>

    </footer>
